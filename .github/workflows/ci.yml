name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  calidad:
    name: Lint, formato, tipos, pruebas y specs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENSPEC_TELEMETRY: 0
      MONGO_URI: mongodb://localhost:27017/minho_gloss
    services:
      # MongoDB real para las pruebas e2e (usan la base minho_gloss_e2e)
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Lint (oxlint)
        run: npm run lint
      - name: Formato (Prettier)
        run: npm run format:check
      - name: Pruebas unitarias
        run: npm test
      - name: Pruebas e2e
        run: npm run test:e2e
      - name: Build
        run: npm run build
      - name: Specs de OpenSpec
        run: npm run specs:validate
